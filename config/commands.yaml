commands:

  edge: '"C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"'

  excel: '"C:/Program Files (x86)/Microsoft Office/root/Office16/EXCEL.EXE"'

  notepad: 'notepad.exe'

  calculator: 'calc.exe'

  github: '"C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" https://github.com'

  youtube: '"C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" https://youtube.com'

  jira: '"C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" https://jira.company.com'

  ticket-tool: '"C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" https://company.service-now.com'

  open downloads: 'explorer.exe shell:Downloads'

  open documents: 'explorer.exe shell:Personal'

  focus on: 'powershell -Command "Set-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Notifications\Settings -Name NOC_GLOBAL_SETTING_TOASTS_ENABLED -Value 0"'

  focus off: 'powershell -Command "Set-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Notifications\Settings -Name NOC_GLOBAL_SETTING_TOASTS_ENABLED -Value 1"'

  search web: '"C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" https://www.google.com/search?q='

  take screenshot: '__TAKE_SCREENSHOT__'


workflows:

  start work:
    - edge
    - ticket-tool
    - jira


exit:

  exit: true


aliases:

  open edge: edge
  launch edge: edge
  start edge: edge

  open excel: excel
  launch excel: excel
  start excel: excel

  open notepad: notepad
  launch notepad: notepad

  open calculator: calculator

  open github: github
  github website: github

  open youtube: youtube

  open jira: jira

  ticket tool: ticket-tool

  open my downloads: open downloads
  show downloads: open downloads

  open my documents: open documents
  show documents: open documents

  do not disturb: focus on
  enable focus: focus on
  disable focus: focus off
  turn on focus: focus on
  turn off focus: focus off

  search the web: search web
  google: search web

  screenshot: take screenshot
  capture screen: take screenshot

  quit: exit
  shutdown assistant: exit
  close assistant: exit